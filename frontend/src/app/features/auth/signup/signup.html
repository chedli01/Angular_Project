<div
  class="min-h-screen flex items-center justify-center bg-linear-to-tr from-green-100 via-blue-100 to-green-50 p-6 animate-fadeIn">
  <div
    class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-md transform transition-transform hover:scale-105 duration-500">
    <h2
      class="text-3xl font-bold mb-8 text-center text-gradient bg-clip-text text-transparent from-blue-500 to-green-500 bg-linear-to-r animate-textGlow">
      Create Your Account
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

      <!-- Name -->
      <div class="relative">
        <label class="block mb-1 font-medium text-gray-700">Full Name</label>
        <input type="text" formControlName="name" placeholder="John Doe"
          class="w-full px-5 py-3 border-2 border-gray-300 rounded-xl focus:border-green-400 focus:ring-2 focus:ring-blue-300 transition-all outline-none" />
        <p *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
          class="text-red-500 text-sm mt-1 animate-pulse">
          Name must have at least 3 characters.
        </p>
      </div>

      <!-- Email -->
      <div class="relative">
        <label class="block mb-1 font-medium text-gray-700">Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com"
          class="w-full px-5 py-3 border-2 border-gray-300 rounded-xl focus:border-green-400 focus:ring-2 focus:ring-blue-300 transition-all outline-none" />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
          class="text-red-500 text-sm mt-1 animate-pulse">
          Please enter a valid email address.
        </p>
      </div>

      <!-- Password -->
      <div class="relative">
        <label class="block mb-1 font-medium text-gray-700">Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password"
          class="w-full px-5 py-3 border-2 border-gray-300 rounded-xl focus:border-green-400 focus:ring-2 focus:ring-blue-300 transition-all outline-none" />
        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
          class="text-red-500 text-sm mt-1 animate-pulse">
          Password must be at least 6 characters.
        </p>
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="form.invalid || loading"
        class="w-full py-3 bg-linear-to-r from-green-400 to-blue-500 hover:from-blue-500 hover:to-green-400 text-white font-semibold rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ loading ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="mt-6 text-center text-gray-600">
      Already have an account?
      <a routerLink="/login" class="text-green-500 font-semibold hover:text-blue-500 transition-colors">
        Login
      </a>
    </p>
  </div>
</div>

<style>
  /* Custom animation for gradient text */
  @keyframes textGlow {

    0%,
    100% {
      background-position: 0% 50%;
    }

    50% {
      background-position: 100% 50%;
    }
  }

  .animate-textGlow {
    background-size: 200% 200%;
    animation: textGlow 3s ease infinite;
  }

  /* Fade-in page effect */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fadeIn {
    animation: fadeIn 0.8s ease-out;
  }
</style>
