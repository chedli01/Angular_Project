<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold mb-6 text-center">
      Login
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

      <!-- Email -->
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" formControlName="email"
               class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
           class="text-red-500 text-sm mt-1">
          Please enter a valid email address.
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-1 font-medium">Password</label>
        <input type="password" formControlName="password"
               class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" />
        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
           class="text-red-500 text-sm mt-1">
          Password must be at least 6 characters.
        </p>
      </div>

      <!-- Submit -->
      <button type="submit"
              [disabled]="form.invalid || loading"
              class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <p class="mt-4 text-center text-sm">
      Don't have an account?
      <a routerLink="/signup" class="text-blue-600 hover:underline">Sign Up</a>
    </p>

  </div>
</div>
