<div class="page">
  <h1>Calendar</h1>
  <p class="subtitle">Review your past activity</p>

  <div class="content">
    <div class="card">
      <app-calendar
        [selectedDay]="selectedDay()"
        (daySelected)="onDaySelected($event)"
      ></app-calendar>
    </div>

    <div class="card">
      <app-day-summary
        [selectedDay]="selectedDay()"
        (clearRequested)="selectedDay.set(null)"
      ></app-day-summary>
    </div>
  </div>
</div>
