<div
  cdkDrag
  [cdkDragData]="habit"
  class="flex items-center gap-3 p-4 bg-white rounded-xl border shadow-sm cursor-grab active:cursor-grabbing hover:bg-gray-50 transition"
>
  <!-- Drag handle -->
  <div class="text-gray-400">⠿</div>

  <!-- Icon -->
  <span class="text-xl">{{ habit.icon }}</span>

  <!-- Text -->
  <div class="flex-1">
    <p class="font-medium text-gray-900">
      {{ habit.name }}
    </p>
    <p class="text-sm text-gray-500">
      {{ habit.description }}
    </p>
  </div>
</div>
