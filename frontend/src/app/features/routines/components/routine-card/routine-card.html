<div
  class="border rounded-xl p-6 relative transition-colors flex flex-col"
  [class.bg-white]="routine().active"
  [class.bg-gray-100]="!routine().active"
  [class.opacity-75]="!routine().active"
  (clickOutside)="closeMenu()"
>
  <!-- Header with title and menu button -->
  <div class="flex items-start justify-between gap-4 mb-4">
    <div class="flex-1">
      <h3 class="text-2xl font-bold mb-3">{{ routine().name }}</h3>
      <h4>{{routine().type}}</h4>
      
      <!-- Active/Inactive Toggle -->
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 cursor-pointer group">
          <div class="relative">
            <input
              type="checkbox"
              class="sr-only peer"
              [checked]="routine().active"
              (change)="onToggleActive()"
            />
            <div
              class="w-11 h-6 bg-gray-300 rounded-full peer 
                     peer-checked:bg-green-500 transition-colors"
            ></div>
            <div
              class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full
                     transition-transform peer-checked:translate-x-5 shadow-sm"
            ></div>
          </div>
          <span class="text-sm font-medium" [class.text-gray-600]="!routine().active" [class.text-green-700]="routine().active">
            @if(routine().active) {
              Active
            } @else {
              Inactive
            }
          </span>
        </label>
      </div>
    </div>

    <!-- Three-dot menu button -->
    <div class="relative shrink-0">
      <button
        (click)="toggleMenu()"
        class="text-gray-400 hover:text-gray-600 p-2 rounded-full hover:bg-gray-100 transition"
        title="More options"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
        </svg>
      </button>

      <!-- Dropdown menu -->
      @if(showMenu()) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border z-10">
          <button
            (click)="onEdit()"
            class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 transition"
          >
            <span class="text-lg">✏️</span>
            <span class="text-sm font-medium">Edit Routine</span>
          </button>
          <button
            (click)="onDelete()"
            class="w-full text-left px-4 py-3 hover:bg-red-50 flex items-center gap-3 text-red-600 transition rounded-b-lg"
          >
            <span class="text-lg">🗑️</span>
            <span class="text-sm font-medium">Delete Routine</span>
          </button>
        </div>
      }
    </div>
  </div>

  <!-- Description - flex-grow pushes it to fill available space -->
  <div class="grow flex items-center">
    <p class="text-gray-600 leading-relaxed text-base">{{ routine().description }}</p>
  </div>
</div>
