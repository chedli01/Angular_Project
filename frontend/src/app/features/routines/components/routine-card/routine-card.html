<div
  class="bg-white border rounded-xl p-6 relative"
  (clickOutside)="closeMenu()"
>
  <!-- Header with title and menu button -->
  <div class="flex items-start justify-between gap-4 mb-3">
    <div class="flex-1">
      <h3 class="text-xl font-bold mb-1">{{ routine().name }}</h3>
      <p class="text-sm text-gray-500">
        @if(routine().active) {
          <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
            Active
          </span>
        } @else {
          <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
            Inactive
          </span>
        }
      </p>
    </div>

    <!-- Three-dot menu button -->
    <div class="relative">
      <button
        (click)="toggleMenu()"
        class="text-gray-400 hover:text-gray-600 p-2 rounded-full hover:bg-gray-100 transition"
        title="More options"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
        </svg>
      </button>

      <!-- Dropdown menu -->
      @if(showMenu()) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border z-10">
          <button
            (click)="onEdit()"
            class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 transition"
          >
            <span class="text-lg">✏️</span>
            <span class="text-sm font-medium">Edit Routine</span>
          </button>
          <button
            (click)="onDelete()"
            class="w-full text-left px-4 py-3 hover:bg-red-50 flex items-center gap-3 text-red-600 transition rounded-b-lg"
          >
            <span class="text-lg">🗑️</span>
            <span class="text-sm font-medium">Delete Routine</span>
          </button>
        </div>
      }
    </div>
  </div>

  <!-- Description -->
  <p class="text-gray-600 leading-relaxed">{{ routine().description }}</p>
</div>
