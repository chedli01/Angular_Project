<div
  class="fixed inset-0 backdrop-blur-sm bg-white/30 flex items-center justify-center z-50"
  (click)="onCancel()"
>
  <div
    class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl border border-gray-100"
    (click)="$event.stopPropagation()"
  >
    <h2 class="text-2xl font-bold mb-6 text-gray-900">
      Create Routine
    </h2>

    <!-- Name -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Name
      </label>
      <input
        type="text"
        placeholder="e.g. Morning workout"
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-blue-500"
        [value]="form().name"
        (input)="updateName($any($event.target).value)"
      />
    </div>

    <!-- Description -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Description
      </label>
      <textarea
        rows="3"
        placeholder="Optional description..."
        class="w-full border border-gray-300 rounded-xl px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
        [value]="form().description"
        (input)="updateDescription($any($event.target).value)"
      ></textarea>
    </div>

    <!-- Icon Selection -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Icon
      </label>
      
      <!-- Selected icon preview -->
      <div class="mb-3 p-3 border border-gray-200 rounded-xl flex items-center gap-3">
        <span class="text-2xl">{{ getSelectedIconEmoji() }}</span>
        <span class="text-sm text-gray-600">
          Selected: {{ selectedIconLabel() }}
        </span>
      </div>

      <!-- Icon grid -->
      <div class="grid grid-cols-6 gap-2">
        @for (icon of iconOptions; track icon.key) {
          <button
            type="button"
            (click)="updateIconKey(icon.key)"
            [class.border-blue-500]="form().iconKey === icon.key"
            [class.border-gray-200]="form().iconKey !== icon.key"
            [class.bg-blue-50]="form().iconKey === icon.key"
            class="p-3 border-2 rounded-xl hover:bg-gray-50 transition-all
                   flex flex-col items-center justify-center gap-1"
            title="{{ icon.label }}"
          >
            <span class="text-2xl">{{ icon.emoji }}</span>
            @if (form().iconKey === icon.key) {
              <span class="text-xs text-blue-600 font-medium">✓</span>
            }
          </button>
        }
      </div>
    </div>

    <!-- Type -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Routine Type
      </label>

      <div class="relative">
        <!-- Icon -->
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl pointer-events-none">
          {{ form().type === RoutineType.Morning ? '🌅' : '🌙' }}
        </span>

        <!-- Select -->
        <select
          class="w-full appearance-none border border-gray-300 rounded-xl
                 pl-12 pr-10 py-3 bg-white
                 focus:outline-none focus:ring-2 focus:ring-blue-500
                 cursor-pointer"
          [value]="form().type"
          (change)="updateType($any($event.target).value)"
        >
          <option [value]="RoutineType.Morning">Morning</option>
          <option [value]="RoutineType.Evening">Evening</option>
        </select>

        <!-- Arrow -->
        <span
          class="absolute right-4 top-1/2 -translate-y-1/2
                 text-gray-400 pointer-events-none"
        >
          ▾
        </span>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex gap-3">
      <button
        (click)="onCancel()"
        class="flex-1 rounded-xl py-3 border border-gray-300
               text-gray-700 hover:bg-gray-100 transition"
      >
        Cancel
      </button>

      <button
        (click)="createRoutine()"
        [disabled]="!form().name.trim()"
        class="flex-1 rounded-xl py-3 bg-blue-600 text-white
               hover:bg-blue-700 transition disabled:opacity-50"
      >
        Create
      </button>
    </div>
  </div>
</div>
