<div class="p-8 max-w-6xl mx-auto">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold mb-6">Routine Builder</h1>
      <h4 class="mb-8 text-gray-600">Group habits into focused routines</h4>
    </div>
    <button
      (click)="openAddDialog()"
      class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
    >
      ➕ Create Routine
    </button>
  </div>
  <div class="flex">
    <app-habits-list [habits]="allHabits()" />
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 mb-6">
      @for (routine of routines(); track routine.id) {
        <app-routine-card
          [routine]="routine"
          (delete)="deleteRoutine($event)"
          (edit)="editRoutine($event)"
          (toggleActive)="toggleActiveRoutine($event)"
          [habits]="routineHabits()[routine.id] || []"
        />
      }
    </div>
  </div>
</div>

<!-- Add Routine Dialog -->
@if (showAddDialog()) {
  <app-add-routine (close)="closeAddDialog()" (routineCreated)="closeAddDialog()" />
}

<!-- Edit Routine Dialog -->
@if (showEditDialog() && routineToEdit()) {
  <app-edit-routine
    [routine]="routineToEdit()!"
    (close)="closeEditDialog()"
    (routineUpdated)="closeEditDialog()"
  />
}
