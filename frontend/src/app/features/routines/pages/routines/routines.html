<div class="p-8 max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold mb-6">Routines</h1>

 <div class="space-y-3 mb-6">
  @for (routine of routines(); track routine.id) {
    <div
      class="bg-white border rounded-xl p-4 flex items-center justify-between gap-4"
    >
      <div class="flex items-center gap-4">
        <div
          class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl"
          [style.backgroundColor]="routine.color + '20'"
        >
          {{ routine.icon }}
        </div>

        <div>
          <h3 class="font-semibold">{{ routine.name }}</h3>
          <p class="text-sm text-gray-600">{{ routine.description }}</p>
        </div>
      </div>

      <!-- Delete button -->
      <button
        (click)="deleteRoutine(routine.id)"
        class="text-red-500 hover:text-red-700 text-xl p-2 rounded-full transition"
        title="Delete Routine"
      >
        🗑️
      </button>
    </div>
  }
</div>


  <button
    (click)="openAddDialog()"
    class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
  >
    ➕ Create Routine
  </button>
</div>

@if (showAddDialog()) {
  <div
    class="fixed inset-0 backdrop-blur-sm bg-white/30 flex items-center justify-center z-50"
    (click)="closeAddDialog()"
  >
    <div
      class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl border border-gray-100"
      (click)="$event.stopPropagation()"
    >
      <h2 class="text-2xl font-bold mb-6 text-gray-900">
        Create Routine
      </h2>

      <!-- Name -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Name
        </label>
        <input
          type="text"
          placeholder="e.g. Morning workout"
          class="w-full border border-gray-300 rounded-xl px-4 py-3
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
          [value]="form().name"
          (input)="updateName($any($event.target).value)"
        />
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Description
        </label>
        <textarea
          rows="3"
          placeholder="Optional description..."
          class="w-full border border-gray-300 rounded-xl px-4 py-3
                 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
          [value]="form().description"
          (input)="updateDescription($any($event.target).value)"
        ></textarea>
      </div>

      <!-- Type -->
     <!-- Type -->
<div class="mb-6">
  <label class="block text-sm font-medium text-gray-700 mb-1">
    Routine Type
  </label>

  <div class="relative">
    <!-- Icon -->
    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl pointer-events-none">
      {{ form().type === RoutineType.Morning ? '🌅' : '🌙' }}
    </span>

    <!-- Select -->
    <select
      class="w-full appearance-none border border-gray-300 rounded-xl
             pl-12 pr-10 py-3 bg-white
             focus:outline-none focus:ring-2 focus:ring-blue-500
             cursor-pointer"
      [value]="form().type"
      (change)="updateType($any($event.target).value)"
    >
      <option [value]="RoutineType.Morning"> Morning</option>
      <option [value]="RoutineType.Evening"> Evening</option>
    </select>

    <!-- Arrow -->
    <span
      class="absolute right-4 top-1/2 -translate-y-1/2
             text-gray-400 pointer-events-none"
    >
      ▾
    </span>
  </div>
</div>


      <!-- Actions -->
      <div class="flex gap-3">
        <button
          (click)="closeAddDialog()"
          class="flex-1 rounded-xl py-3 border border-gray-300
                 text-gray-700 hover:bg-gray-100 transition"
        >
          Cancel
        </button>

        <button
          (click)="createRoutine()"
          [disabled]="!form().name.trim()"
          class="flex-1 rounded-xl py-3 bg-blue-600 text-white
                 hover:bg-blue-700 transition disabled:opacity-50"
        >
          Create
        </button>
      </div>
    </div>
  </div>
}
