<div class="fixed inset-0 bg-gray-50 bg-opacity-50 flex items-center justify-center z-50"
     (click)="onClose()">
  <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4" (click)="$event.stopPropagation()">
    <h2 class="text-2xl font-bold mb-6">Create New Habit</h2>
    
    <form (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Habit Name</label>
        <input 
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          placeholder="e.g., Morning Exercise"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Description (optional)</label>
        <textarea 
          [(ngModel)]="description"
          name="description"
          placeholder="Add details about your habit..."
          rows="2"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Choose Icon</label>
        <div class="grid grid-cols-6 gap-2">
          @for (icon of icons; track icon) {
            <button
              type="button"
              (click)="selectedIcon.set(icon)"
              [class.ring-2]="selectedIcon() === icon"
              [class.ring-blue-500]="selectedIcon() === icon"
              class="w-12 h-12 text-2xl rounded-lg hover:bg-gray-100 transition">
              {{ icon }}
            </button>
          }
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Choose Color</label>
        <div class="flex gap-2">
          @for (color of colors; track color) {
            <button
              type="button"
              (click)="selectedColor.set(color)"
              [style.backgroundColor]="color"
              [class.ring-2]="selectedColor() === color"
              [class.ring-offset-2]="selectedColor() === color"
              class="w-10 h-10 rounded-full">
            </button>
          }
        </div>
      </div>

      <div class="flex gap-3">
        <button 
          type="button"
          (click)="onClose()"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
          Cancel
        </button>
        <button 
          type="submit"
          [disabled]="!name().trim()"
          [class.opacity-50]="!name().trim()"
          [class.cursor-not-allowed]="!name().trim()"
          class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
          Create
        </button>
      </div>
    </form>
  </div>
</div>
