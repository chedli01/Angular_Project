<div
  class="w-64 bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden">

  <!-- Header -->
  <div class="px-4 py-3 border-b border-gray-200 bg-gray-50">
    <h3 class="text-sm font-semibold text-gray-900">Settings</h3>
  </div>

  <div class="p-3 space-y-2">
    <!-- Account Section -->
    <div class="space-y-1">
      <p class="px-3 py-1 text-xs font-medium text-gray-500 uppercase tracking-wider">Account</p>
      
      <button
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition duration-200 group">
        <svg class="w-5 h-5 text-gray-600 group-hover:text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="text-sm text-gray-700">Profile Settings</span>
      </button>
    </div>

    <hr class="my-2 border-gray-200">

    <!-- Data Section -->
    <div class="space-y-1">
      <p class="px-3 py-1 text-xs font-medium text-gray-500 uppercase tracking-wider">Data</p>
      
      <button
        (click)="resetRoutines()"
        [disabled]="isProcessing()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-red-600 hover:bg-red-50 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed group">
        <svg class="w-5 h-5 group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span class="text-sm font-medium">
          {{ isProcessing() ? 'Resetting...' : 'Reset all routines' }}
        </span>
      </button>
    </div>

    <hr class="my-2 border-gray-200">

    <!-- Session Section -->
    <div class="space-y-1">
      <p class="px-3 py-1 text-xs font-medium text-gray-500 uppercase tracking-wider">Session</p>
      
      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-orange-600 hover:bg-orange-50 transition duration-200 group">
        <svg class="w-5 h-5 group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="text-sm font-medium">Logout</span>
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="px-4 py-2 border-t border-gray-200 bg-gray-50">
    <p class="text-xs text-gray-500">v1.0.0</p>
  </div>
</div>
