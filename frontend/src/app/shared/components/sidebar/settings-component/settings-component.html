<div
  class="w-56 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg">

  <div class="p-2 space-y-1 text-sm">
    <!-- Logout -->
    <button
      (click)="logout()"
      class="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">
      🚪
      <span>Logout</span>
    </button>

    <hr class="my-1 border-gray-200 dark:border-gray-700">

    <!-- Reset -->
    <button
      (click)="resetRoutines()"
      [disabled]="isProcessing()"
      class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition disabled:opacity-50">
      🗑️
      <span>Reset all routines</span>
    </button>

  </div>
</div>
